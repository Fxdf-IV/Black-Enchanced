# Regras padrão do modo Deathmatch (MVP 0.1 — Black Enhanced Online)
# Este arquivo documenta os parâmetros que alimentam netcore::RulesConfig::default_deathmatch().

[match]
mode = "deathmatch"
tick_rate_hz = 30
snapshot_rate_hz = 15
max_players = 4
max_health = 100
kill_limit = 15
time_limit_s = 600
respawn_delay_ticks = 90
max_speed_units_per_sec = 18.0
arena_id = 0

[security]
max_packets_per_window = 120
max_violations_before_kick = 5

[[spawns]]
position = [0.0, 0.0, 0.0]
yaw = 0.0

[[spawns]]
position = [32.0, 0.0, 0.0]
yaw = 3.14159

[[spawns]]
position = [0.0, 0.0, 32.0]
yaw = -1.57079

[[spawns]]
position = [32.0, 0.0, 32.0]
yaw = 1.57079

