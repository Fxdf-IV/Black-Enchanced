# Placeholder limpo (baseado no template MIT de sdk/templates/game/config/game.toml).
# build.bat substitui este arquivo no primeiro build com a configuracao gerada por xbe_symbols:
#   out\build\release\xbe_symbols.exe assets\default.xbe sdk\xdk --library BlackEnhancedOnline.dll --out config\game.toml
# Simbolos em 0 geram stubs; localize-os no Ghidra
# (python sdk\tools\symbols\xbe2pe.py config\game.toml game.exe) e preencha manualmente.
[xbe]
path = "assets/default.xbe"
out = "generated/game"
library = "BlackEnhancedOnline.dll"  # <exe>.dll carregada com delay load pelo executavel
partitions = 64

# Correcoes opcionais, adicionadas manualmente apos inspeccao do XBE:
# data_ranges = [[0x00150000, 0x00150040]]  # em [xbe]: bytes em secoes de codigo que nao sao codigo, fim exclusivo
#
# [[hook]]                   # chama void FixSomething(X86Context& ctx, uint8_t* base), definido pelo jogo
# at = 0x0012ABCD            # instrucao guest dentro de funcao recompilada
# call = "FixSomething"
# after = false              # true executa apos a instrucao (nao apos jumps ou ret)
# on_true = "ret"            # com on_true ou on_false o hook retorna bool: "ret" retorna como o ret da funcao,
# on_false = 0x0012AC00      # ou um endereco salta para aquela instrucao da mesma funcao
#
# [[function]]               # entrada perdida pela analise ou que passou do limite
# at = 0x00123450
# end = 0x00123520           # opcional, parar decodificacao (exclusivo)
#
# [[switch]]                 # jmp indireto cuja tabela nao foi detectada corretamente
# at = 0x00123480
# targets = [0x00123490, 0x001234A8]
#
# [abi]
# D3D_InternalRelease = ["esi"]            # ordem dos argumentos na API para biblioteca link-time:
# D3D_MakeRequestedSpace = ["eax", "stack"]  # registrador, ou "stack" para o proximo slot na pilha
